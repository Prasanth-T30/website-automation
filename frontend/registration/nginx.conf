server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable; the entry HTML must never be cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The form posts to the HRM API. Proxying here keeps the browser
    # same-origin, so the submission is not a CORS preflight and the API never
    # has to allow this site as a cross-origin writer.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Payment screenshots are up to 5 MB; nginx defaults to 1 MB.
        client_max_body_size 10m;
    }

    # SPA fallback so client-side routes survive a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
