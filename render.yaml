# Render blueprint — the API, and the scheduled document run.
#
# Firebase stays the database. Render has no GCP identity of its own, so the
# Admin SDK cannot authenticate ambiently the way it does on Cloud Run: supply
# a service account through FIREBASE_SERVICE_ACCOUNT_JSON (raw JSON, or base64
# if the dashboard mangles newlines). Without it the API fails at startup.
#
# Every `sync: false` value is set once in the Render dashboard and never
# committed. Nothing secret belongs in this file.
#
# Both services need a paid plan: Render's free tier has no cron jobs, and a
# free web service sleeps after inactivity, which puts a ~50s cold start in
# front of the first request — including a public registration submitted by
# someone who will assume the form is broken.
#
# If you would rather stay on free, drop the cron service and drive the run
# over HTTP instead: any external scheduler can POST
# /api/v1/automation/run?dry_run=false with the AUTOMATION_TOKEN header.

# This blueprint builds the Dockerfile, which installs from pyproject.toml.
# `backend/requirements.txt` is for the other path — Render's native Python
# runtime, which looks for that file and ignores the Dockerfile entirely. To
# switch, replace the three docker lines on a service with:
#
#     runtime: python
#     rootDir: ./backend
#     buildCommand: pip install -r requirements.txt
#     startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
#
# (`backend/.python-version` pins 3.12 for that runtime.) Keep the two
# dependency lists in step if you do; pyproject.toml stays the source of truth.

services:
  - type: web
    name: dvein-hrm-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production

      # ── Firebase ──────────────────────────────────────────────────────
      - key: FIREBASE_PROJECT_ID
        value: dvein-hrm
      - key: FIREBASE_STORAGE_BUCKET
        value: dvein-hrm.firebasestorage.app
      # The whole service-account key file, pasted as one value.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      # ── Security ──────────────────────────────────────────────────────
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "14"
      # The browser only ever talks to the Vercel origin: vercel.json forwards
      # /api to this service, so the session cookie is first-party and `lax`
      # is both correct and stricter than the cross-site alternative.
      #
      # Switch to COOKIE_SAMESITE=none only if you point the frontends
      # straight at this host instead of proxying — and know that Safari
      # blocks the resulting third-party cookie whatever SameSite says.
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      # Only needed if the console and API end up on subdomains of one domain
      # (".dveininnovation.com") and you stop proxying. Blank otherwise.
      - key: COOKIE_DOMAIN
        sync: false

      # ── Origins ───────────────────────────────────────────────────────
      # With the Vercel proxy in front, the browser never makes a cross-origin
      # call and CORS is not exercised at all. Still worth setting to the two
      # site origins: it is the backstop if anything ever calls this host
      # directly, and an empty list would then refuse everything.
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false

      # ── Application ───────────────────────────────────────────────────
      - key: REPORTING_TIMEZONE
        value: Asia/Kolkata
      - key: PUBLIC_FORM_RATE_LIMIT
        value: 20/minute;200/hour
      - key: LOGIN_RATE_LIMIT
        value: 10/minute;100/hour

      # ── Email ─────────────────────────────────────────────────────────
      # Render's free tier blocks outbound SMTP (25/465/587) to stop spam, so
      # a free instance cannot reach a mail server at all — the failure is
      # "Network is unreachable" from the socket, not a rejection from the
      # server, and no credential changes it. Set RESEND_API_KEY and mail goes
      # over HTTPS instead, which is never blocked. The SMTP settings below
      # are then unused, and are kept for hosts that do permit it.
      - key: EMAIL_PROVIDER
        value: auto
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURITY
        value: starttls
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: Dvein Innovations
      - key: SMTP_REPLY_TO
        sync: false

      # ── Scheduled sending ─────────────────────────────────────────────
      # The cron below calls the CLI in-process, so no HTTP token is needed
      # for it. AUTOMATION_TOKEN only matters if something external POSTs
      # /api/v1/automation/run as well.
      - key: AUTOMATION_ENABLED
        value: "false"
      # Whether this process runs the daily job on a timer of its own, at
      # 09:00 Asia/Kolkata. Both this and AUTOMATION_ENABLED must be true.
      # Two flags rather than one because `.env` ships with automation on and
      # the test suite reads it — a single flag would start the timer inside
      # every test run.
      #
      # Set this on the web service only, never on the cron service below, or
      # the run happens twice. (Harmless — an already-filed document is never
      # reissued — but it doubles the work for nothing.)
      - key: AUTOMATION_SCHEDULER_ENABLED
        value: "false"
      - key: AUTOMATION_MAX_PER_RUN
        value: "25"
      - key: AUTOMATION_TOKEN
        sync: false

  # Offer letters and certificates that have fallen due. Runs the same code
  # the console does, so an automatic document is identical to a hand-sent one.
  #
  # Reads its own copy of the environment — a cron service does not inherit the
  # web service's. Keep AUTOMATION_ENABLED in step across both, and run
  # `python -m app.cli automation` (without --send) once by hand before
  # switching it on: it prints exactly who would be mailed.
  - type: cron
    name: dvein-documents
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: singapore
    # 09:00 Asia/Kolkata. Render schedules in UTC, so this is 03:30 UTC.
    schedule: "30 3 * * *"
    dockerCommand: python -m app.cli automation --send
    envVars:
      - key: APP_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: dvein-hrm
      - key: FIREBASE_STORAGE_BUCKET
        value: dvein-hrm.firebasestorage.app
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: REPORTING_TIMEZONE
        value: Asia/Kolkata
      - key: EMAIL_PROVIDER
        value: auto
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURITY
        value: starttls
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: Dvein Innovations
      - key: AUTOMATION_ENABLED
        value: "false"
      - key: AUTOMATION_MAX_PER_RUN
        value: "25"
