[project]
name = "dvein-hrm-api"
version = "1.0.0"
description = "Dvein HRM — multi-user web API"
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "firebase-admin>=6.6",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.9",
    "openpyxl>=3.1",
    "fpdf2>=2.8",
    "orjson>=3.10",
    # Windows and slim Linux containers ship no system zoneinfo database, so
    # ZoneInfo("Asia/Kolkata") raises there without this. Monthly revenue
    # reporting depends on resolving the institute's timezone.
    "tzdata>=2024.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Declared rather than auto-discovered. Left to itself, setuptools scans the
# directory and refuses to build the moment it finds a second top-level folder
# alongside `app` — `var/` already triggers exactly that:
#
#   error: Multiple top-level packages discovered in a flat-layout: ['app', 'var']
#
# The Dockerfile happens to dodge it by running `pip install .` when only
# pyproject.toml has been copied in, so nothing is discovered and the build
# quietly succeeds. That is a coincidence of COPY ordering, not a design:
# reordering those two lines, or anyone running `pip install .` from a full
# checkout, brings the error straight back. Naming the package removes the
# scan and with it the trap.
[tool.setuptools.packages.find]
include = ["app*"]

# The letterhead, certificate background, signature and email logo are code
# dependencies, not decoration: offer letters, certificates and outgoing mail
# all fail at runtime without them. A wheel excludes non-Python files unless
# told otherwise, so without this the installed package looks complete and
# then raises a missing-file error the first time an HR sends a letter.
[tool.setuptools.package-data]
app = ["assets/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "pymupdf>=1.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Form()/File()/Depends() are designed to be called in argument
# defaults — that's how the framework wires request parsing to parameters.
# B008 exists to catch mutable-default bugs, not this idiomatic pattern.
"app/api/v1/*.py" = ["B008"]
# Inline-CSS HTML email templates need long attribute strings for
# email-client compatibility; a `# noqa` can't go inside the triple-quoted
# string without corrupting the markup.
"app/services/email.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import `app` straight from the source tree rather than requiring an install.
pythonpath = ["."]
