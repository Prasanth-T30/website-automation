[project]
name = "dvein-hrm-api"
version = "1.0.0"
description = "Dvein HRM — multi-user web API"
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "firebase-admin>=6.6",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.9",
    "openpyxl>=3.1",
    "fpdf2>=2.8",
    "orjson>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import `app` straight from the source tree rather than requiring an install.
pythonpath = ["."]
